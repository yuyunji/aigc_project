services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aigc-workbench
    expose:
      - "8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-20250915}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_CALL_TIMEOUT=${LLM_CALL_TIMEOUT:-120}
      - TASK_TOTAL_TIMEOUT=${TASK_TOTAL_TIMEOUT:-600}
      - MAX_INPUT_CHARS=${MAX_INPUT_CHARS:-200000}
      # 与下面 postgres 服务的 POSTGRES_* 同源，改密码/库名只需改一处；
      # 若要整体接管，直接设 DATABASE_URL 覆盖即可。
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-aigc}:${POSTGRES_PASSWORD:-aigc_pass}@postgres:5432/${POSTGRES_DB:-aigc_workbench}}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_URL_EXPIRE=${OSS_URL_EXPIRE:-3600}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:18-alpine
    container_name: aigc-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aigc_workbench}
      - POSTGRES_USER=${POSTGRES_USER:-aigc}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aigc_pass}
    ports:
      # 仅用于从宿主机直连容器内的库做排查；app 服务走 compose 内网 postgres:5432，不依赖这个映射。
      # 默认映射到 5433：宿主机上常驻的原生 PostgreSQL 已占用 5432，直接映射会 port already allocated。
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # PG18 起官方镜像的 VOLUME 上移一层，数据实际落在 /var/lib/postgresql/18/docker；
      # 挂旧路径 /var/lib/postgresql/data 会因目录不存在直接启动失败。
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # 显式走 TCP：首次 initdb 期间 entrypoint 会起一个只监听 unix socket 的临时 server，
      # 不带 -h 时 pg_isready 会误判为就绪，导致 app 抢跑后崩一次。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: aigc-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
