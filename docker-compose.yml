# ================================================================
# Docker Compose — 一键启动 AIGC 短剧工作台
# 用法: docker compose up -d
# ================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aigc-workbench
    # 不对外暴露端口，仅 caddy 内部访问
    expose:
      - "8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-20250915}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-2}
      - LLM_CALL_TIMEOUT=${LLM_CALL_TIMEOUT:-120}
      - TASK_TOTAL_TIMEOUT=${TASK_TOTAL_TIMEOUT:-600}
      - MAX_INPUT_CHARS=${MAX_INPUT_CHARS:-200000}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: aigc-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # 持久化 SSL 证书
      - caddy_config:/config      # 持久化 Caddy 配置
    restart: unless-stopped
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:

  # 可选：前端开发模式（不需要构建）
